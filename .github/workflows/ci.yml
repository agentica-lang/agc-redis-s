name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.32.0-alpha.1
          sha256: 5df3bfe3d915117533bc7b1cdb68a7106db3f373cff007143568cbf8d707cb2d # linux-x86_64

      - name: Check, format and test
        run: |
          agentica --version
          make check
          make fmt-check
          make test
          make integration
