name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.31.1
          sha256: 82a516c5f83f3c68e9e215bb672301e97ffa9fb15edf01c3b153f6819b9b51df # linux-x86_64

      - name: Check, format and test
        run: |
          agentica --version
          make check
          make fmt-check
          make test
          make integration
