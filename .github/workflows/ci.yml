name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.38.0
          sha256: e3452adc1c70423970284e29f90ea54b68900137da5d80f1650c243b568c5464 # linux-x86_64

      - name: Check, format and test
        run: |
          agentica --version
          make check
          make fmt-check
          make test
          make integration
